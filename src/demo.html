<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Leads Genetics — Engineered Growth</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- React + Babel (CDN, no build step) -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<!-- Three.js for the 3D genetics field -->
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>

<style>
:root{
  --bg: #FAFAF7;
  --bg-alt: #F1F0EA;
  --ink: #14161C;
  --ink-soft: #52565F;
  --hairline: #E4E2DA;
  --accent: #4B3AFF;
  --accent-2: #2FD4C4;
  --accent-soft: #ECEAFF;
  --radius: 18px;
  --display: 'Space Grotesk', sans-serif;
  --body: 'Inter', sans-serif;
  --mono: 'JetBrains Mono', monospace;
}

*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}

::selection{background:var(--accent); color:#fff;}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; scroll-behavior:auto !important;}
}

/* ---------- Layout helpers ---------- */
.container{max-width:1240px; margin:0 auto; padding:0 32px;}
@media (max-width:640px){.container{padding:0 20px;}}

.eyebrow{
  font-family:var(--mono);
  font-size:12px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--accent);
  display:flex;
  align-items:center;
  gap:10px;
}
.eyebrow::before{
  content:'';
  width:6px;height:6px;
  border-radius:50%;
  background:var(--accent-2);
  box-shadow:0 0 0 4px rgba(47,212,196,0.18);
}

/* ---------- Navbar ---------- */
.navbar{
  position:fixed; top:0; left:0; right:0; z-index:100;
  padding:22px 0;
  transition:all .35s ease;
}
.navbar.scrolled{
  padding:14px 0;
  background:rgba(250,250,247,0.75);
  backdrop-filter: blur(16px) saturate(1.4);
  -webkit-backdrop-filter: blur(16px) saturate(1.4);
  border-bottom:1px solid var(--hairline);
}
.nav-inner{display:flex; align-items:center; justify-content:space-between;}
.logo{
  font-family:var(--display);
  font-weight:700;
  font-size:20px;
  letter-spacing:-0.01em;
  display:flex; align-items:center; gap:10px;
}
.logo-mark{
  width:30px;height:30px;
  position:relative;
  flex-shrink:0;
}
.logo-mark svg{width:100%; height:100%;}
.nav-links{
  display:flex; gap:36px; align-items:center;
  font-size:14.5px; font-weight:500; color:var(--ink-soft);
}
.nav-links a{position:relative; padding:4px 0; transition:color .25s;}
.nav-links a:hover{color:var(--ink);}
.nav-links a::after{
  content:''; position:absolute; left:0; bottom:0; width:0; height:1.5px;
  background:var(--accent); transition:width .3s ease;
}
.nav-links a:hover::after{width:100%;}
.nav-cta{
  padding:11px 22px;
  background:var(--ink);
  color:#fff;
  border-radius:100px;
  font-size:14px; font-weight:600;
  display:inline-flex; align-items:center; gap:8px;
  transition:transform .25s ease, background .25s ease;
}
.nav-cta:hover{background:var(--accent); transform:translateY(-2px);}
.nav-toggle{display:none;}

@media (max-width:900px){
  .nav-links{display:none;}
  .nav-toggle{display:block;}
}

/* ---------- Hero ---------- */
.hero{
  position:relative;
  min-height:100vh;
  display:flex;
  align-items:center;
  overflow:hidden;
  padding-top:80px;
}
.hero-video-wrap{
  position:absolute; inset:0; z-index:0;
  overflow:hidden;
}
.hero-video-wrap video{
  position:absolute; top:50%; left:50%;
  width:100%; height:100%;
  object-fit:cover;
  transform:translate(-50%,-50%);
  opacity:0.16;
  filter:saturate(0.7) brightness(1.05);
}
.hero-video-scrim{
  position:absolute; inset:0;
  background:
    radial-gradient(ellipse 60% 50% at 20% 20%, rgba(75,58,255,0.10), transparent 60%),
    radial-gradient(ellipse 50% 45% at 85% 75%, rgba(47,212,196,0.10), transparent 60%),
    linear-gradient(180deg, rgba(250,250,247,0.35) 0%, rgba(250,250,247,0.55) 55%, rgba(250,250,247,0.98) 100%);
}
#hero-canvas{
  position:absolute; inset:0; z-index:1;
  pointer-events:none;
}
.hero-content{
  position:relative; z-index:2;
  width:100%;
}
.hero-grid{
  display:grid;
  grid-template-columns:1.15fr 0.85fr;
  gap:60px;
  align-items:end;
}
@media (max-width:900px){
  .hero-grid{grid-template-columns:1fr; gap:40px;}
}
.hero-eyebrow{margin-bottom:26px;}
.hero-title{
  font-family:var(--display);
  font-weight:600;
  font-size:clamp(42px, 6.2vw, 84px);
  line-height:0.98;
  letter-spacing:-0.03em;
  color:var(--ink);
}
.hero-title em{
  font-style:normal;
  background:linear-gradient(100deg, var(--accent), #7B6BFF 45%, var(--accent-2));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
.hero-title .strand{
  display:inline-block;
  position:relative;
}
.hero-sub-col{
  border-left:1px solid var(--hairline);
  padding-left:32px;
}
.hero-desc{
  font-size:17px;
  line-height:1.65;
  color:var(--ink-soft);
  max-width:38ch;
  margin-bottom:28px;
}
.hero-actions{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:36px;}
.btn-primary{
  padding:15px 28px;
  background:var(--ink);
  color:#fff;
  border-radius:100px;
  font-weight:600;
  font-size:15px;
  display:inline-flex; align-items:center; gap:10px;
  transition:all .3s cubic-bezier(.2,.8,.2,1);
  box-shadow:0 1px 0 rgba(0,0,0,0.05);
}
.btn-primary:hover{
  background:var(--accent);
  transform:translateY(-3px);
  box-shadow:0 14px 28px -10px rgba(75,58,255,0.5);
}
.btn-secondary{
  padding:15px 26px;
  border:1px solid var(--hairline);
  border-radius:100px;
  font-weight:600;
  font-size:15px;
  color:var(--ink);
  display:inline-flex; align-items:center; gap:8px;
  transition:all .3s ease;
  background:rgba(255,255,255,0.5);
}
.btn-secondary:hover{border-color:var(--ink); background:#fff;}
.hero-stats{display:flex; gap:30px;}
.hero-stat b{
  display:block;
  font-family:var(--mono);
  font-size:26px;
  font-weight:500;
  color:var(--ink);
}
.hero-stat span{
  font-size:12.5px;
  color:var(--ink-soft);
}
.scroll-cue{
  position:absolute; bottom:36px; left:50%; transform:translateX(-50%);
  z-index:2;
  display:flex; flex-direction:column; align-items:center; gap:8px;
  font-family:var(--mono); font-size:11px; letter-spacing:0.12em;
  color:var(--ink-soft); text-transform:uppercase;
}
.scroll-cue .line{width:1px; height:34px; background:linear-gradient(var(--ink-soft), transparent); animation:scrollpulse 2s ease-in-out infinite;}
@keyframes scrollpulse{0%,100%{opacity:0.25;} 50%{opacity:1;}}

/* ---------- Marquee strip ---------- */
.marquee-strip{
  border-top:1px solid var(--hairline);
  border-bottom:1px solid var(--hairline);
  padding:22px 0;
  overflow:hidden;
  background:var(--bg-alt);
  position:relative; z-index:2;
}
.marquee-track{
  display:flex; gap:60px; white-space:nowrap;
  animation:marquee 28s linear infinite;
  width:max-content;
}
@keyframes marquee{from{transform:translateX(0);} to{transform:translateX(-50%);}}
.marquee-track span{
  font-family:var(--mono); font-size:13px; color:var(--ink-soft);
  display:flex; align-items:center; gap:10px;
}
.marquee-track span::after{content:'◆'; color:var(--accent-2); font-size:8px; margin-left:50px;}

/* ---------- Section shared ---------- */
.section{padding:150px 0; position:relative;}
@media (max-width:768px){.section{padding:100px 0;}}
.section-head{
  display:flex; justify-content:space-between; align-items:flex-end;
  margin-bottom:70px; gap:40px;
}
@media (max-width:768px){.section-head{flex-direction:column; align-items:flex-start; gap:20px;}}
.section-title{
  font-family:var(--display);
  font-weight:600;
  font-size:clamp(32px, 4vw, 52px);
  letter-spacing:-0.025em;
  line-height:1.05;
  margin-top:16px;
  max-width:14ch;
}
.section-note{
  font-size:15.5px; color:var(--ink-soft); max-width:34ch; line-height:1.6;
  text-align:right;
}
@media (max-width:768px){.section-note{text-align:left;}}

.reveal{
  opacity:0; transform:translateY(36px);
  transition:opacity .9s cubic-bezier(.2,.7,.2,1), transform .9s cubic-bezier(.2,.7,.2,1);
}
.reveal.in{opacity:1; transform:translateY(0);}

/* ---------- Services (Premium 3-card) ---------- */
.services{background:var(--bg);}
.service-list{display:flex; flex-direction:column; border-top:1px solid var(--hairline);}
.service-row{
  display:grid;
  grid-template-columns:100px 1fr 1.1fr 130px;
  gap:40px;
  align-items:center;
  padding:44px 0;
  border-bottom:1px solid var(--hairline);
  position:relative;
  transition:padding-left .45s cubic-bezier(.2,.8,.2,1);
  cursor:pointer;
}
.service-row:hover{padding-left:16px;}
.service-row::before{
  content:'';
  position:absolute; left:-32px; top:0; bottom:0; width:3px;
  background:linear-gradient(var(--accent), var(--accent-2));
  transform:scaleY(0); transform-origin:top;
  transition:transform .45s ease;
}
.service-row:hover::before{transform:scaleY(1);}
@media (max-width:900px){
  .service-row{grid-template-columns:60px 1fr; row-gap:14px;}
  .service-num{grid-row:1;}
  .service-name{grid-row:1;}
  .service-desc{grid-column:1/-1;}
  .service-link{grid-column:1/-1; justify-self:start;}
}
.service-num{
  font-family:var(--mono); font-size:14px; color:var(--accent);
}
.service-name{
  font-family:var(--display); font-weight:600; font-size:26px; letter-spacing:-0.01em;
  display:flex; align-items:center; gap:16px;
}
.service-icon{
  width:44px; height:44px;
  border-radius:12px;
  background:var(--accent-soft);
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
  transition:background .35s ease, transform .35s ease;
}
.service-row:hover .service-icon{background:var(--ink); transform:rotate(-8deg) scale(1.05);}
.service-icon svg{width:20px; height:20px; stroke:var(--accent); transition:stroke .35s ease;}
.service-row:hover .service-icon svg{stroke:#fff;}
.service-desc{font-size:15px; color:var(--ink-soft); line-height:1.6;}
.service-link{
  justify-self:end;
  width:52px; height:52px;
  border-radius:50%;
  border:1px solid var(--hairline);
  display:flex; align-items:center; justify-content:center;
  transition:all .4s cubic-bezier(.2,.8,.2,1);
}
.service-link svg{width:16px; height:16px; transition:transform .4s ease;}
.service-row:hover .service-link{background:var(--accent); border-color:var(--accent); transform:rotate(45deg);}
.service-row:hover .service-link svg{stroke:#fff;}

/* ---------- Process / signature strand section ---------- */
.strand-section{
  background:var(--ink);
  color:#fff;
  padding:150px 0;
  position:relative;
  overflow:hidden;
}
.strand-section .eyebrow{color:var(--accent-2);}
.strand-section .eyebrow::before{background:var(--accent-2); box-shadow:0 0 0 4px rgba(47,212,196,0.22);}
.strand-title{
  font-family:var(--display); font-weight:600;
  font-size:clamp(28px,3.4vw,44px);
  letter-spacing:-0.02em;
  max-width:20ch;
  margin:18px 0 70px;
  color:#fff;
}
.strand-title span{color:var(--accent-2);}
#strand-canvas{position:absolute; inset:0; opacity:0.55;}
.strand-steps{
  display:grid; grid-template-columns:repeat(4,1fr); gap:1px;
  background:rgba(255,255,255,0.08);
  border-radius:20px; overflow:hidden;
  position:relative; z-index:2;
}
@media (max-width:900px){.strand-steps{grid-template-columns:1fr 1fr;}}
@media (max-width:560px){.strand-steps{grid-template-columns:1fr;}}
.strand-step{
  background:rgba(20,22,28,0.7);
  backdrop-filter:blur(6px);
  padding:34px 28px;
  transition:background .3s ease;
}
.strand-step:hover{background:rgba(75,58,255,0.25);}
.strand-step .sn{font-family:var(--mono); font-size:12px; color:var(--accent-2); letter-spacing:0.1em;}
.strand-step h4{font-family:var(--display); font-size:19px; font-weight:600; margin:14px 0 10px;}
.strand-step p{font-size:13.5px; color:rgba(255,255,255,0.6); line-height:1.6;}

/* ---------- Results / stats band ---------- */
.results{
  background:var(--bg-alt);
  border-top:1px solid var(--hairline);
  border-bottom:1px solid var(--hairline);
  padding:100px 0;
}
.results-grid{
  display:grid; grid-template-columns:repeat(4,1fr); gap:1px;
  background:var(--hairline);
}
@media (max-width:900px){.results-grid{grid-template-columns:1fr 1fr;}}
.result-cell{
  background:var(--bg-alt);
  padding:34px 30px;
  text-align:center;
}
.result-cell b{
  font-family:var(--display); font-weight:600;
  font-size:44px; letter-spacing:-0.02em;
  display:block;
  background:linear-gradient(100deg, var(--ink), var(--accent) 120%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.result-cell span{font-size:13px; color:var(--ink-soft); margin-top:6px; display:block;}

/* ---------- CTA banner ---------- */
.cta-banner{
  margin:0 auto;
  max-width:1240px;
  padding:80px 60px;
  background:linear-gradient(135deg, var(--ink) 0%, #1E2130 100%);
  border-radius:28px;
  position:relative;
  overflow:hidden;
  text-align:center;
  color:#fff;
}
@media (max-width:640px){.cta-banner{padding:60px 28px; border-radius:20px;}}
.cta-banner::before{
  content:'';
  position:absolute; inset:0;
  background:radial-gradient(circle at 30% 20%, rgba(75,58,255,0.35), transparent 55%),
             radial-gradient(circle at 80% 80%, rgba(47,212,196,0.28), transparent 50%);
}
.cta-banner h2{
  position:relative; z-index:1;
  font-family:var(--display); font-weight:600;
  font-size:clamp(30px,4.6vw,50px);
  letter-spacing:-0.02em;
  max-width:16ch; margin:0 auto 30px;
}
.cta-banner .btn-primary{position:relative; z-index:1; background:#fff; color:var(--ink);}
.cta-banner .btn-primary:hover{background:var(--accent-2); color:var(--ink);}

/* ---------- Footer ---------- */
footer{background:var(--ink); color:rgba(255,255,255,0.85); padding-top:90px;}
.footer-top{
  display:grid; grid-template-columns:1.4fr 1fr 1fr 1fr; gap:50px;
  padding-bottom:70px;
  border-bottom:1px solid rgba(255,255,255,0.1);
}
@media (max-width:768px){.footer-top{grid-template-columns:1fr 1fr; row-gap:44px;}}
.footer-brand .logo{color:#fff; margin-bottom:18px;}
.footer-brand p{font-size:14.5px; color:rgba(255,255,255,0.55); max-width:32ch; line-height:1.6; margin-bottom:24px;}
.footer-social{display:flex; gap:10px;}
.footer-social a{
  width:38px; height:38px; border-radius:50%;
  border:1px solid rgba(255,255,255,0.15);
  display:flex; align-items:center; justify-content:center;
  transition:all .3s ease;
}
.footer-social a:hover{background:var(--accent); border-color:var(--accent); transform:translateY(-3px);}
.footer-social svg{width:15px; height:15px; stroke:#fff;}
.footer-col h5{
  font-family:var(--mono); font-size:12px; letter-spacing:0.1em; text-transform:uppercase;
  color:rgba(255,255,255,0.4); margin-bottom:20px;
}
.footer-col a{
  display:block; font-size:14.5px; color:rgba(255,255,255,0.75);
  margin-bottom:13px; transition:color .25s ease; width:fit-content;
}
.footer-col a:hover{color:var(--accent-2);}
.footer-bottom{
  display:flex; justify-content:space-between; align-items:center;
  padding:26px 0; flex-wrap:wrap; gap:12px;
  font-size:13px; color:rgba(255,255,255,0.4);
}
.footer-bottom a{color:rgba(255,255,255,0.4);}
.footer-bottom a:hover{color:#fff;}
.footer-legal{display:flex; gap:22px;}

/* utility */
.grad-divider{height:1px; background:linear-gradient(90deg, transparent, var(--hairline), transparent);}
</style>
</head>
<body>

<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useEffect, useRef, useState } = React;

/* ============ Reveal-on-scroll hook ============ */
function useReveal(){
  useEffect(()=>{
    const els = document.querySelectorAll('.reveal');
    const io = new IntersectionObserver((entries)=>{
      entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
    }, {threshold:0.15});
    els.forEach(el=>io.observe(el));
    return ()=>io.disconnect();
  },[]);
}

/* ============ Logo mark (helix node) ============ */
function LogoMark(){
  return (
    <span className="logo-mark">
      <svg viewBox="0 0 30 30" fill="none">
        <path d="M6 4C6 4 6 15 15 15C24 15 24 26 24 26" stroke="#4B3AFF" strokeWidth="2" strokeLinecap="round"/>
        <path d="M24 4C24 4 24 15 15 15C6 15 6 26 6 26" stroke="#2FD4C4" strokeWidth="2" strokeLinecap="round"/>
        <circle cx="6" cy="4" r="2.4" fill="#4B3AFF"/>
        <circle cx="24" cy="26" r="2.4" fill="#4B3AFF"/>
        <circle cx="24" cy="4" r="2.4" fill="#2FD4C4"/>
        <circle cx="6" cy="26" r="2.4" fill="#2FD4C4"/>
      </svg>
    </span>
  );
}

/* ============ Navbar ============ */
function Navbar(){
  const [scrolled, setScrolled] = useState(false);
  useEffect(()=>{
    const onScroll = ()=> setScrolled(window.scrollY > 40);
    window.addEventListener('scroll', onScroll);
    return ()=>window.removeEventListener('scroll', onScroll);
  },[]);
  return (
    <nav className={`navbar ${scrolled ? 'scrolled':''}`}>
      <div className="container nav-inner">
        <a href="#top" className="logo"><LogoMark/> Leads Genetics</a>
        <div className="nav-links">
          <a href="#services">Services</a>
          <a href="#process">Process</a>
          <a href="#results">Results</a>
          <a href="#contact">Contact</a>
        </div>
        <a href="#contact" className="nav-cta">Book a call →</a>
      </div>
    </nav>
  );
}

/* ============ 3D Hero background (Three.js helix / node field) ============ */
function HeroCanvas(){
  const mountRef = useRef(null);

  useEffect(()=>{
    const mount = mountRef.current;
    if(!mount || !window.THREE) return;

    const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(55, mount.clientWidth/mount.clientHeight, 0.1, 1000);
    camera.position.set(0, 0, 32);

    const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(mount.clientWidth, mount.clientHeight);
    mount.appendChild(renderer.domElement);

    // Two intertwined helix strands made of nodes
    const group = new THREE.Group();
    scene.add(group);

    const colorA = new THREE.Color(0x4B3AFF);
    const colorB = new THREE.Color(0x2FD4C4);

    const strandCount = 60;
    const radius = 9;
    const height = 46;
    const nodesA = [], nodesB = [];

    const nodeGeo = new THREE.SphereGeometry(0.22, 12, 12);

    for(let i=0;i<strandCount;i++){
      const t = i/strandCount;
      const angle = t * Math.PI * 6;
      const y = (t - 0.5) * height;

      const xA = Math.cos(angle) * radius;
      const zA = Math.sin(angle) * radius;
      const matA = new THREE.MeshBasicMaterial({ color: colorA, transparent:true, opacity: 0.55 });
      const meshA = new THREE.Mesh(nodeGeo, matA);
      meshA.position.set(xA, y, zA);
      group.add(meshA);
      nodesA.push(meshA);

      const xB = Math.cos(angle + Math.PI) * radius;
      const zB = Math.sin(angle + Math.PI) * radius;
      const matB = new THREE.MeshBasicMaterial({ color: colorB, transparent:true, opacity: 0.55 });
      const meshB = new THREE.Mesh(nodeGeo, matB);
      meshB.position.set(xB, y, zB);
      group.add(meshB);
      nodesB.push(meshB);

      // rungs every few nodes
      if(i % 4 === 0){
        const rungGeo = new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(xA,y,zA), new THREE.Vector3(xB,y,zB)
        ]);
        const rungMat = new THREE.LineBasicMaterial({ color: 0xC9C6FF, transparent:true, opacity:0.18 });
        group.add(new THREE.Line(rungGeo, rungMat));
      }
    }

    // connecting lines along each strand
    const lineGeoA = new THREE.BufferGeometry().setFromPoints(nodesA.map(m=>m.position));
    group.add(new THREE.Line(lineGeoA, new THREE.LineBasicMaterial({color:0x4B3AFF, transparent:true, opacity:0.28})));
    const lineGeoB = new THREE.BufferGeometry().setFromPoints(nodesB.map(m=>m.position));
    group.add(new THREE.Line(lineGeoB, new THREE.LineBasicMaterial({color:0x2FD4C4, transparent:true, opacity:0.28})));

    // ambient floating particles (leads scattering)
    const particleCount = 140;
    const positions = new Float32Array(particleCount*3);
    for(let i=0;i<particleCount;i++){
      positions[i*3] = (Math.random()-0.5)*70;
      positions[i*3+1] = (Math.random()-0.5)*50;
      positions[i*3+2] = (Math.random()-0.5)*40 - 5;
    }
    const pGeo = new THREE.BufferGeometry();
    pGeo.setAttribute('position', new THREE.BufferAttribute(positions,3));
    const pMat = new THREE.PointsMaterial({ color:0x9C93FF, size:0.28, transparent:true, opacity:0.4 });
    const particles = new THREE.Points(pGeo, pMat);
    scene.add(particles);

    group.rotation.x = 0.15;
    group.position.x = 6;

    let mouseX = 0, mouseY = 0;
    const onMouseMove = (e)=>{
      mouseX = (e.clientX / window.innerWidth - 0.5);
      mouseY = (e.clientY / window.innerHeight - 0.5);
    };
    window.addEventListener('mousemove', onMouseMove);

    let raf;
    const clock = new THREE.Clock();
    const animate = ()=>{
      const t = clock.getElapsedTime();
      if(!prefersReduced){
        group.rotation.y = t * 0.12;
        group.rotation.z = Math.sin(t*0.15)*0.05;
        particles.rotation.y = t * 0.02;
      }
      camera.position.x += (mouseX*4 - camera.position.x) * 0.02;
      camera.position.y += (-mouseY*3 - camera.position.y) * 0.02;
      camera.lookAt(6,0,0);
      renderer.render(scene, camera);
      raf = requestAnimationFrame(animate);
    };
    animate();

    const onResize = ()=>{
      camera.aspect = mount.clientWidth/mount.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(mount.clientWidth, mount.clientHeight);
    };
    window.addEventListener('resize', onResize);

    return ()=>{
      cancelAnimationFrame(raf);
      window.removeEventListener('resize', onResize);
      window.removeEventListener('mousemove', onMouseMove);
      renderer.dispose();
      if(mount.contains(renderer.domElement)) mount.removeChild(renderer.domElement);
    };
  },[]);

  return <div id="hero-canvas" ref={mountRef}></div>;
}

/* ============ Strand section 3D backdrop (subtle) ============ */
function StrandCanvas(){
  const mountRef = useRef(null);
  useEffect(()=>{
    const mount = mountRef.current;
    if(!mount || !window.THREE) return;
    const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, mount.clientWidth/mount.clientHeight, 0.1, 1000);
    camera.position.set(0,0,26);

    const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
    renderer.setSize(mount.clientWidth, mount.clientHeight);
    mount.appendChild(renderer.domElement);

    const geo = new THREE.IcosahedronGeometry(10, 1);
    const mat = new THREE.MeshBasicMaterial({ color:0x4B3AFF, wireframe:true, transparent:true, opacity:0.14 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.x = 14;
    scene.add(mesh);

    const geo2 = new THREE.IcosahedronGeometry(6, 1);
    const mat2 = new THREE.MeshBasicMaterial({ color:0x2FD4C4, wireframe:true, transparent:true, opacity:0.12 });
    const mesh2 = new THREE.Mesh(geo2, mat2);
    mesh2.position.set(-16, -6, -6);
    scene.add(mesh2);

    let raf;
    const clock = new THREE.Clock();
    const animate = ()=>{
      const t = clock.getElapsedTime();
      if(!prefersReduced){
        mesh.rotation.y = t*0.08; mesh.rotation.x = t*0.05;
        mesh2.rotation.y = -t*0.06; mesh2.rotation.x = t*0.04;
      }
      renderer.render(scene, camera);
      raf = requestAnimationFrame(animate);
    };
    animate();

    const onResize = ()=>{
      camera.aspect = mount.clientWidth/mount.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(mount.clientWidth, mount.clientHeight);
    };
    window.addEventListener('resize', onResize);
    return ()=>{
      cancelAnimationFrame(raf);
      window.removeEventListener('resize', onResize);
      renderer.dispose();
      if(mount.contains(renderer.domElement)) mount.removeChild(renderer.domElement);
    };
  },[]);
  return <div id="strand-canvas" ref={mountRef}></div>;
}
